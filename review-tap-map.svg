<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" font-family="Segoe UI, Arial, sans-serif">
  <!-- Option B: no list at all. Tap boxes on the map: orange = not checked, green = keep, grey = wrong. -->
  <rect width="1200" height="675" fill="#5f6b55"/>
  <g stroke="#3d4038" stroke-width="22" fill="none"><path d="M0 200 L1200 380"/><path d="M420 0 L300 675"/><path d="M940 0 L820 675"/></g>

  <!-- kept (green, tick) -->
  <g fill="#2ea043" fill-opacity="0.3" stroke="#2ea043" stroke-width="3">
    <rect x="60" y="60" width="120" height="70"/><rect x="200" y="70" width="110" height="65"/><rect x="60" y="260" width="130" height="70"/>
    <rect x="480" y="80" width="120" height="70"/><rect x="620" y="90" width="120" height="70"/>
  </g>
  <g font-size="22" font-weight="700" fill="#fff" text-anchor="middle"><text x="120" y="103">✓</text><text x="255" y="110">✓</text><text x="125" y="303">✓</text><text x="540" y="123">✓</text><text x="680" y="133">✓</text></g>
  <!-- wrong (grey, crossed) -->
  <g fill="#000" fill-opacity="0.35" stroke="#bbb" stroke-width="3"><rect x="210" y="270" width="100" height="60"/><rect x="980" y="80" width="110" height="65"/></g>
  <g font-size="22" fill="#ddd" text-anchor="middle"><text x="260" y="308">✕</text><text x="1035" y="120">✕</text></g>
  <!-- not checked yet (orange dashed) -->
  <g fill="#e8460a" fill-opacity="0.15" stroke="#e8460a" stroke-width="3" stroke-dasharray="8 5">
    <rect x="480" y="420" width="120" height="70"/><rect x="620" y="430" width="110" height="65"/><rect x="980" y="430" width="120" height="70"/><rect x="60" y="450" width="120" height="70"/>
  </g>

  <!-- top: one tap does what? -->
  <rect x="380" y="18" width="440" height="44" rx="22" fill="#fff"/>
  <rect x="384" y="22" width="140" height="36" rx="18" fill="#2ea043"/><text x="454" y="46" font-size="15" font-weight="700" fill="#fff" text-anchor="middle">Tap = keep</text>
  <text x="600" y="46" font-size="15" fill="#333" text-anchor="middle">Tap = wrong</text>
  <text x="745" y="46" font-size="15" fill="#333" text-anchor="middle">Tap = fix</text>

  <!-- bottom: one slim bar -->
  <rect x="300" y="590" width="600" height="64" rx="32" fill="#fff"/>
  <text x="330" y="628" font-size="16" fill="#222"><tspan font-weight="700" fill="#2ea043">84</tspan> keep · <tspan font-weight="700">12</tspan> wrong · <tspan font-weight="700" fill="#e8460a">244</tspan> left</text>
  <rect x="640" y="600" width="250" height="44" rx="22" fill="#e8460a"/><text x="765" y="628" font-size="16" font-weight="700" fill="#fff" text-anchor="middle">Add 84 to OpenStreetMap</text>

  <g font-size="14" fill="#fff"><text x="20" y="568">Drag a box around many to mark them all at once.</text></g>
  <rect x="460" y="400" width="300" height="110" fill="none" stroke="#fff" stroke-width="2" stroke-dasharray="4 4"/>
</svg>
