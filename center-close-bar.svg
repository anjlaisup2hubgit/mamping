<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" font-family="Segoe UI, Arial, sans-serif">
  <!-- Three review-mode fixes.
       1. Tapping a building in Fix shape slides it to the middle of the screen (it used to sit near the top, under the bar).
       2. A ✕ next to Select hides the top bar (and the bottom bar) when you are done checking.
       3. The bottom bar is wider, so "Add 15 to OpenStreetMap" stays on the same line as the rest. -->
  <defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#fff"/></marker></defs>
  <rect width="1200" height="675" fill="#5f6b55"/>
  <g stroke="#fff" stroke-opacity="0.4" stroke-width="2"><line x1="400" y1="70" x2="400" y2="650"/><line x1="800" y1="70" x2="800" y2="650"/></g>

  <!-- ===== 1: centre the building ===== -->
  <text x="200" y="50" font-size="20" font-weight="700" fill="#fff" text-anchor="middle">1 · Building moves to the middle</text>
  <text x="40" y="100" font-size="14" fill="#fff">Before: stuck up top</text>
  <rect x="60" y="115" width="280" height="190" rx="10" fill="#4b5743" stroke="#fff" stroke-opacity="0.5"/>
  <rect x="110" y="122" width="180" height="24" rx="12" fill="#fff"/>
  <rect x="175" y="140" width="50" height="34" fill="#ffd166" fill-opacity="0.25" stroke="#ffd166" stroke-width="1.5"/>
  <line x1="60" y1="210" x2="340" y2="210" stroke="#fff" stroke-dasharray="4 4" stroke-opacity="0.5"/>
  <text x="200" y="295" font-size="12" fill="#fff" text-anchor="middle">hidden behind the top bar</text>
  <path d="M200 320 L200 360" stroke="#fff" stroke-width="2" marker-end="url(#a)"/>
  <text x="40" y="390" font-size="14" fill="#fff">After: in the middle</text>
  <rect x="60" y="405" width="280" height="190" rx="10" fill="#4b5743" stroke="#fff" stroke-opacity="0.5"/>
  <rect x="110" y="412" width="180" height="24" rx="12" fill="#fff"/>
  <rect x="175" y="483" width="50" height="34" fill="#ffd166" fill-opacity="0.25" stroke="#ffd166" stroke-width="1.5"/>
  <g stroke="#fff" stroke-opacity="0.5" stroke-dasharray="4 4"><line x1="60" y1="500" x2="340" y2="500"/><line x1="200" y1="405" x2="200" y2="595"/></g>
  <text x="200" y="630" font-size="13" fill="#fff" text-anchor="middle">Easy to see and fix</text>

  <!-- ===== 2: close the top bar ===== -->
  <text x="600" y="50" font-size="20" font-weight="700" fill="#fff" text-anchor="middle">2 · ✕ to hide the top bar</text>
  <text x="430" y="100" font-size="14" fill="#fff">New ✕ next to Select</text>
  <g transform="translate(430 120)">
    <rect width="340" height="44" rx="22" fill="#fff"/>
    <g font-size="14" fill="#1c1c1c"><text x="18" y="27">Fix shape</text><text x="98" y="27">Remove</text></g>
    <rect x="160" y="6" width="56" height="32" rx="16" fill="#e8470f"/><text x="188" y="27" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">Keep</text>
    <line x1="228" y1="12" x2="228" y2="32" stroke="#ddd"/>
    <text x="240" y="27" font-size="14" fill="#1c1c1c">Select</text>
    <circle cx="310" cy="22" r="16" fill="none" stroke="#e8470f" stroke-width="2.5"/>
    <text x="310" y="27" font-size="15" fill="#6e6e69" text-anchor="middle">✕</text>
  </g>
  <path d="M600 190 L600 240" stroke="#fff" stroke-width="2" marker-end="url(#a)"/>
  <text x="430" y="270" font-size="14" fill="#fff">After tapping ✕</text>
  <rect x="460" y="285" width="280" height="250" rx="10" fill="#4b5743" stroke="#fff" stroke-opacity="0.5"/>
  <g fill="#2ea043" fill-opacity="0.35" stroke="#2ea043" stroke-width="1.5"><rect x="510" y="340" width="60" height="40"/><rect x="590" y="340" width="60" height="40"/><rect x="550" y="420" width="70" height="44"/></g>
  <text x="600" y="315" font-size="13" fill="#fff" text-anchor="middle">no bar on top, no bar at bottom</text>
  <g font-size="13" fill="#fff"><text x="430" y="580">Just the map. Tapping a box</text><text x="430" y="600">opens checking again.</text></g>

  <!-- ===== 3: bottom bar on one line ===== -->
  <text x="1000" y="50" font-size="20" font-weight="700" fill="#fff" text-anchor="middle">3 · Bottom bar on one line</text>
  <text x="830" y="100" font-size="14" fill="#fff">Before: button drops down</text>
  <g transform="translate(830 115)">
    <rect width="300" height="96" rx="28" fill="#fff"/>
    <text x="18" y="30" font-size="13" fill="#1c1c1c"><tspan fill="#2ea043" font-weight="700">15</tspan> keep · <tspan font-weight="700">6</tspan> to check</text>
    <rect x="230" y="12" width="56" height="28" rx="14" fill="#fff" stroke="#ddd"/><text x="258" y="31" font-size="12" text-anchor="middle" fill="#1c1c1c">More</text>
    <rect x="14" y="54" width="180" height="30" rx="15" fill="#e8470f"/><text x="104" y="74" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">Add 15 to OpenStreetMap</text>
    <circle cx="214" cy="69" r="14" fill="#f5f5f3"/><text x="214" y="74" font-size="12" text-anchor="middle" fill="#1c1c1c">✕</text>
  </g>
  <path d="M980 230 L980 275" stroke="#fff" stroke-width="2" marker-end="url(#a)"/>
  <text x="830" y="305" font-size="14" fill="#fff">After: all in one row</text>
  <g transform="translate(815 320)">
    <rect width="370" height="50" rx="25" fill="#fff"/>
    <text x="16" y="30" font-size="12" fill="#1c1c1c"><tspan fill="#2ea043" font-weight="700">15</tspan> keep · <tspan font-weight="700">6</tspan> to check</text>
    <rect x="130" y="11" width="48" height="28" rx="14" fill="#fff" stroke="#ddd"/><text x="154" y="30" font-size="11" text-anchor="middle" fill="#1c1c1c">More</text>
    <rect x="184" y="11" width="146" height="28" rx="14" fill="#e8470f"/><text x="257" y="30" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">Add 15 to OpenStreetMap</text>
    <circle cx="350" cy="25" r="13" fill="#f5f5f3"/><text x="350" y="30" font-size="11" text-anchor="middle" fill="#1c1c1c">✕</text>
  </g>
  <g font-size="13" fill="#fff"><text x="830" y="410">The same goes for the Fix shape bar:</text><text x="830" y="430">Name · Checked · Add to OSM · ⋯ · ✕</text><text x="830" y="460">The bar can now be up to 620 px wide</text><text x="830" y="480">(it was 440 px). On narrow phones it</text><text x="830" y="500">still folds onto two lines.</text></g>
</svg>
