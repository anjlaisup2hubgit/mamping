<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" font-family="Segoe UI, Arial, sans-serif">
  <!-- Option A: one building at a time. The map zooms to it; a short bar at the bottom asks Yes / No. -->
  <rect width="1200" height="675" fill="#5f6b55"/>
  <g stroke="#3d4038" stroke-width="40" fill="none"><path d="M0 80 L1200 260"/><path d="M200 0 L60 675"/></g>
  <g fill="#7d7468"><rect x="120" y="330" width="170" height="110"/><rect x="900" y="360" width="200" height="120"/></g>

  <!-- the building being checked, big in the middle -->
  <rect x="470" y="170" width="280" height="160" transform="rotate(20 610 250)" fill="#ffd166" fill-opacity="0.25" stroke="#ffd166" stroke-width="5"/>
  <!-- the next ones fade, so you can see what is coming -->
  <g fill="none" stroke="#e8460a" stroke-width="3" stroke-dasharray="8 5" opacity="0.6">
    <rect x="860" y="120" width="160" height="90" transform="rotate(20 940 165)"/>
    <rect x="300" y="60" width="140" height="80" transform="rotate(20 370 100)"/>
  </g>

  <!-- top: progress, small -->
  <rect x="440" y="20" width="320" height="40" rx="20" fill="#fff"/>
  <text x="600" y="46" font-size="16" fill="#222" text-anchor="middle"><tspan font-weight="700">12</tspan> of 340 · 9 kept · 3 wrong</text>
  <rect x="460" y="56" width="280" height="4" rx="2" fill="#eee"/><rect x="460" y="56" width="10" height="4" rx="2" fill="#e8460a"/>

  <!-- bottom bar: about 1/6 of the screen -->
  <rect x="300" y="565" width="600" height="90" rx="22" fill="#fff"/>
  <rect x="320" y="585" width="70" height="50" rx="14" fill="#f1f1f1"/><text x="355" y="616" font-size="15" fill="#555" text-anchor="middle">◀ Back</text>
  <rect x="402" y="585" width="150" height="50" rx="14" fill="#fde3d8"/><text x="477" y="616" font-size="17" font-weight="700" fill="#b8350a" text-anchor="middle">✕ Not a building</text>
  <rect x="564" y="585" width="120" height="50" rx="14" fill="#f1f1f1"/><text x="624" y="616" font-size="17" fill="#333" text-anchor="middle">Fix shape</text>
  <rect x="696" y="585" width="184" height="50" rx="14" fill="#e8460a"/><text x="788" y="616" font-size="17" font-weight="700" fill="#fff" text-anchor="middle">✓ Matches</text>

  <!-- notes -->
  <g font-size="14" fill="#fff">
    <text x="20" y="560">Each answer jumps to the next building.</text>
    <text x="20" y="582">Keyboard: → or Y = matches, N = not a building, ← = back.</text>
    <text x="20" y="604">Kept ones are added to OpenStreetMap together at the end.</text>
  </g>
</svg>
