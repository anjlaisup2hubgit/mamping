<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" font-family="Segoe UI, Arial, sans-serif">
  <!-- What happens after you send buildings to OpenStreetMap, in 3 steps. Grey = on the map, orange dashed = new scan box. -->
  <rect width="1200" height="675" fill="#f4f2ec"/>
  <g font-size="20" font-weight="700" fill="#222">
    <text x="30" y="48">1. You tap Add</text><text x="420" y="48">2. They show on the map at once</text><text x="810" y="48">3. You scan again</text>
  </g>

  <!-- three map panels -->
  <g fill="#5f6b55"><rect x="30" y="70" width="360" height="480" rx="14"/></g>
  <g fill="#e9e6dc" stroke="#d2cec2"><rect x="420" y="70" width="360" height="480" rx="14"/><rect x="810" y="70" width="360" height="480" rx="14"/></g>
  <g stroke="#3d4038" stroke-width="16" fill="none"><path d="M30 300 L390 360"/><path d="M200 70 L170 550"/></g>
  <g stroke="#fff" stroke-width="16" fill="none"><path d="M420 300 L780 360"/><path d="M590 70 L560 550"/><path d="M810 300 L1170 360"/><path d="M980 70 L950 550"/></g>

  <!-- panel 1: three kept boxes (green) on satellite -->
  <g fill="#2ea043" fill-opacity="0.3" stroke="#2ea043" stroke-width="3">
    <rect x="55" y="110" width="90" height="60"/><rect x="55" y="190" width="90" height="70"/><rect x="230" y="120" width="120" height="70"/>
  </g>
  <g font-size="20" font-weight="700" fill="#fff" text-anchor="middle"><text x="100" y="147">✓</text><text x="100" y="232">✓</text><text x="290" y="162">✓</text></g>
  <rect x="60" y="480" width="300" height="44" rx="22" fill="#e8460a"/><text x="210" y="508" font-size="16" font-weight="700" fill="#fff" text-anchor="middle">Add 3 to OpenStreetMap</text>

  <!-- panel 2: same three now grey OSM buildings, even with no internet -->
  <g fill="#9a9a94" fill-opacity="0.25" stroke="#7a7a74" stroke-width="2">
    <rect x="445" y="110" width="90" height="60"/><rect x="445" y="190" width="90" height="70"/><rect x="620" y="120" width="120" height="70"/>
    <rect x="620" y="400" width="110" height="70"/>
  </g>
  <rect x="440" y="480" width="320" height="44" rx="22" fill="#222"/><text x="600" y="508" font-size="15" fill="#fff" text-anchor="middle">3 buildings added to OpenStreetMap</text>

  <!-- panel 3: new scan; sent ones get no box, only the truly new roofs do -->
  <g fill="#9a9a94" fill-opacity="0.25" stroke="#7a7a74" stroke-width="2">
    <rect x="835" y="110" width="90" height="60"/><rect x="835" y="190" width="90" height="70"/><rect x="1010" y="120" width="120" height="70"/>
    <rect x="1010" y="400" width="110" height="70"/>
  </g>
  <g fill="#e8460a" fill-opacity="0.15" stroke="#e8460a" stroke-width="3" stroke-dasharray="8 5">
    <rect x="835" y="390" width="100" height="65"/><rect x="1010" y="210" width="110" height="60"/>
  </g>
  <g font-size="13" fill="#555"><text x="835" y="100">no box on what you sent</text><text x="835" y="384">new roof → box</text></g>

  <!-- arrows -->
  <g fill="#888"><path d="M395 300 l18 10 l-18 10z"/><path d="M785 300 l18 10 l-18 10z"/></g>

  <!-- note -->
  <rect x="30" y="580" width="1140" height="70" rx="14" fill="#fff" stroke="#d2cec2"/>
  <text x="55" y="610" font-size="16" fill="#222"><tspan font-weight="700">Before:</tspan> step 2 stayed empty for a few minutes, so step 3 put orange boxes back on the 3 you just sent.</text>
  <text x="55" y="635" font-size="16" fill="#222"><tspan font-weight="700">Now:</tspan> they show right away (offline ones too), and if you draw over one you get the “already on the map” warning.</text>
</svg>
