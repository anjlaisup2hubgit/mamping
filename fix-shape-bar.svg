<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" font-family="Segoe UI, Arial, sans-serif">
  <!-- Option A: the big panel becomes one slim bar at the bottom. Help text becomes a one-line tip; Save outline moves into the ⋯ menu. -->
  <rect width="1200" height="675" fill="#5f6b55"/>
  <g stroke="#3d4038" stroke-width="30" fill="none"><path d="M0 120 L1200 330"/><path d="M880 0 L760 675"/></g>
  <g fill="#7d7468"><rect x="120" y="360" width="170" height="110"/><rect x="930" y="420" width="190" height="110"/><rect x="380" y="380" width="150" height="90"/></g>

  <!-- top mode picker stays as it is -->
  <rect x="400" y="18" width="400" height="44" rx="22" fill="#fff"/>
  <text x="470" y="46" font-size="15" fill="#333" text-anchor="middle">Tap = keep</text>
  <text x="590" y="46" font-size="15" fill="#333" text-anchor="middle">Tap = remove</text>
  <rect x="660" y="22" width="136" height="36" rx="18" fill="#e8460a"/><text x="728" y="46" font-size="15" font-weight="700" fill="#fff" text-anchor="middle">Tap = fix</text>

  <!-- the building being fixed: now fully visible -->
  <polygon points="520,170 680,200 660,320 500,290" fill="#ffd166" fill-opacity="0.25" stroke="#ffd166" stroke-width="4"/>
  <g fill="#e8460a" stroke="#fff" stroke-width="3"><circle cx="520" cy="170" r="11"/><circle cx="680" cy="200" r="11"/><circle cx="660" cy="320" r="11"/><circle cx="500" cy="290" r="11"/></g>
  <g fill="#fff" stroke="#e8460a" stroke-width="2"><circle cx="600" cy="185" r="6"/><circle cx="670" cy="260" r="6"/><circle cx="580" cy="305" r="6"/><circle cx="510" cy="230" r="6"/></g>
  <circle cx="590" cy="245" r="14" fill="#e8460a" stroke="#fff" stroke-width="3"/>

  <!-- one-line tip, fades after a few seconds; ? brings it back -->
  <rect x="380" y="500" width="440" height="34" rx="17" fill="#000" fill-opacity="0.55"/>
  <text x="600" y="522" font-size="14" fill="#fff" text-anchor="middle">Drag dots to fit the roof · white dot = add corner</text>

  <!-- the slim bar: one row, about 1/8 of the screen -->
  <rect x="200" y="560" width="800" height="76" rx="38" fill="#fff"/>
  <!-- icon buttons: rectangle, undo, not a building -->
  <g fill="none" stroke="#333" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="250" cy="598" r="24" fill="#f2f2f2" stroke="none"/><rect x="239" y="590" width="22" height="16" rx="2"/>
    <circle cx="308" cy="598" r="24" fill="#f2f2f2" stroke="none"/><path d="M298 594 h14 a7 7 0 0 1 0 14 h-8"/><path d="M302 588 l-6 6 l6 6"/>
    <circle cx="366" cy="598" r="24" fill="#f2f2f2" stroke="none"/><path d="M357 589 l18 18 M375 589 l-18 18"/>
  </g>
  <!-- name -->
  <rect x="408" y="576" width="250" height="44" rx="22" fill="#f6f6f6" stroke="#ddd"/>
  <text x="428" y="604" font-size="15" fill="#999">Name (optional)</text>
  <!-- send: the tick lives on the button, so no separate checkbox row -->
  <rect x="672" y="576" width="250" height="44" rx="22" fill="#e8460a"/>
  <rect x="688" y="588" width="20" height="20" rx="4" fill="#fff"/><path d="M692 598 l4 4 l8 -9" fill="none" stroke="#e8460a" stroke-width="2.5"/>
  <text x="808" y="604" font-size="15" font-weight="700" fill="#fff" text-anchor="middle">Checked · Add to OSM</text>
  <!-- more: Save outline, help -->
  <circle cx="958" cy="598" r="22" fill="#f2f2f2"/><g fill="#333"><circle cx="949" cy="598" r="2.5"/><circle cx="958" cy="598" r="2.5"/><circle cx="967" cy="598" r="2.5"/></g>

  <!-- labels for the reader -->
  <g font-size="12" fill="#fff" text-anchor="middle"><text x="250" y="654">Rectangle</text><text x="308" y="654">Undo</text><text x="366" y="654">Not one</text><text x="958" y="654">Save outline</text></g>
</svg>
