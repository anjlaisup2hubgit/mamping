<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 844" width="390" height="844" font-family="Fredoka, Nunito, Arial, sans-serif">
<title>Main page mockup</title>
<defs>
 <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#bcdcfd"/><stop offset=".22" stop-color="#eaf4ff" stop-opacity=".0"/></linearGradient>
 <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#cfe4fb" stop-opacity="0"/><stop offset="1" stop-color="#a9cdf6"/></linearGradient>
 <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".95"/><stop offset="1" stop-color="#e6f1ff" stop-opacity=".82"/></linearGradient>
 <linearGradient id="blue" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6cb6ff"/><stop offset="1" stop-color="#2f7df0"/></linearGradient>
 <linearGradient id="sun" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffe17a"/><stop offset="1" stop-color="#ffbe2e"/></linearGradient>
 <linearGradient id="park" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#bdeaa8"/><stop offset="1" stop-color="#8fd27a"/></linearGradient>
 <linearGradient id="water" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8cc6fb"/><stop offset="1" stop-color="#4b9cf0"/></linearGradient>
 <radialGradient id="halo"><stop offset="0" stop-color="#2f7df0" stop-opacity=".35"/><stop offset="1" stop-color="#2f7df0" stop-opacity="0"/></radialGradient>
 <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#14305c" flood-opacity=".16"/></filter>
</defs>

<!-- Map fills the whole screen -->
<rect width="390" height="844" fill="#f3f7fc"/>
<path d="M-10 250 C70 230 120 300 110 380 C100 450 30 470 -10 470Z" fill="url(#water)"/>
<path d="M280 600 C330 560 390 580 400 600 V720 C350 720 300 690 280 600Z" fill="url(#water)"/>
<rect x="230" y="190" width="110" height="80" rx="28" fill="url(#park)"/>
<ellipse cx="160" cy="560" rx="58" ry="36" fill="url(#park)"/>
<g fill="none" stroke="#fff" stroke-linecap="round">
 <path d="M140 0 L190 844" stroke-width="22"/><path d="M-10 420 C120 400 250 470 400 430" stroke-width="18"/>
 <path d="M0 160 L400 330" stroke-width="12"/><path d="M300 0 L250 844" stroke-width="12"/><path d="M0 680 L400 760" stroke-width="12"/>
</g>
<g fill="none" stroke="#dfe7f1" stroke-linecap="round">
 <path d="M140 0 L190 844" stroke-width="1"/><path d="M-10 420 C120 400 250 470 400 430" stroke-width="1"/>
</g>
<!-- Buildings already on the map -->
<g fill="#fff6dc" stroke="#e7a92a" stroke-width="2" filter="url(#shadow)">
 <rect x="40" y="300" width="56" height="34" rx="6"/><rect x="210" y="300" width="40" height="52" rx="6"/>
 <rect x="268" y="356" width="60" height="34" rx="6"/><rect x="50" y="500" width="44" height="54" rx="6"/>
 <rect x="216" y="500" width="70" height="40" rx="6"/><rect x="40" y="610" width="70" height="36" rx="6"/>
</g>
<!-- Missing buildings found by the scan -->
<g fill="#dcebff" fill-opacity=".8" stroke="#2f7df0" stroke-width="2" stroke-dasharray="5 4">
 <rect x="300" y="460" width="44" height="40" rx="6"/><rect x="226" y="600" width="50" height="34" rx="6"/>
</g>

<!-- Soft sky at the top and bottom so controls float -->
<rect width="390" height="200" fill="url(#sky)"/>
<rect y="640" width="390" height="204" fill="url(#floor)"/>

<!-- You are here -->
<circle cx="180" cy="452" r="46" fill="url(#halo)"/>
<circle cx="180" cy="452" r="15" fill="url(#blue)" stroke="#fff" stroke-width="4" filter="url(#shadow)"/>

<!-- Top: search + you -->
<g filter="url(#shadow)">
 <rect x="16" y="54" width="296" height="52" rx="26" fill="url(#glass)" stroke="#fff"/>
 <circle cx="44" cy="80" r="7" fill="none" stroke="#14305c" stroke-width="2"/><path d="M49 85 l6 6" stroke="#14305c" stroke-width="2" stroke-linecap="round"/>
 <text x="64" y="86" font-family="Nunito, Arial" font-size="16" fill="#5f7898">Search a place</text>
 <circle cx="348" cy="80" r="27" fill="url(#blue)"/>
 <circle cx="348" cy="80" r="23" fill="#9ccbf8" stroke="#fff" stroke-width="3"/>
 <text x="348" y="88" text-anchor="middle" font-size="22" font-weight="600" fill="#14305c">A</text>
</g>

<!-- Right: map tools stacked -->
<g filter="url(#shadow)">
 <rect x="330" y="128" width="46" height="138" rx="23" fill="url(#glass)" stroke="#fff"/>
 <path d="M353 141 l11 6-11 6-11-6z M342 153 l11 6 11-6" fill="none" stroke="#14305c" stroke-width="1.8" stroke-linejoin="round"/>
 <line x1="342" y1="174" x2="364" y2="174" stroke="#d5e5f8"/>
 <rect x="341" y="185" width="24" height="24" rx="12" fill="url(#sun)"/><text x="353" y="202" text-anchor="middle" font-size="12" fill="#14305c">S</text>
 <line x1="342" y1="220" x2="364" y2="220" stroke="#d5e5f8"/>
 <circle cx="353" cy="243" r="8" fill="none" stroke="#14305c" stroke-width="1.8"/><circle cx="353" cy="243" r="2" fill="#14305c"/>
 <path d="M353 231v4M353 251v4M341 243h4M361 243h4" stroke="#14305c" stroke-width="1.8" stroke-linecap="round"/>
</g>

<!-- Floating action above the nav -->
<g filter="url(#shadow)">
 <rect x="122" y="668" width="146" height="44" rx="22" fill="url(#sun)" stroke="#fff" stroke-width="2"/>
 <rect x="140" y="681" width="18" height="18" rx="4" fill="none" stroke="#14305c" stroke-width="1.8"/>
 <path d="M149 686v8M145 690h8" stroke="#14305c" stroke-width="1.8" stroke-linecap="round"/>
 <text x="168" y="696" font-size="16" font-weight="500" fill="#14305c">Find missing</text>
</g>

<!-- Bottom nav: same place on every page -->
<g filter="url(#shadow)">
 <rect x="16" y="740" width="358" height="72" rx="36" fill="url(#glass)" stroke="#fff"/>
 <rect x="26" y="750" width="72" height="52" rx="26" fill="url(#blue)"/>
 <circle cx="62" cy="768" r="8" fill="none" stroke="#fff" stroke-width="1.8"/><path d="M66 764l-2 6-6 2 2-6z" fill="#fff"/>
 <text x="62" y="794" text-anchor="middle" font-size="11" font-weight="500" fill="#fff">Map</text>
 <path d="M124 760l5 5-10 10-6 1 1-6z" fill="none" stroke="#5f7898" stroke-width="1.8" stroke-linejoin="round"/>
 <text x="122" y="794" text-anchor="middle" font-size="11" fill="#5f7898">Edits</text>
 <circle cx="195" cy="760" r="34" fill="#fff"/>
 <circle cx="195" cy="760" r="29" fill="url(#blue)"/>
 <path d="M181 754a3 3 0 013-3h3l2-3h12l2 3h3a3 3 0 013 3v13a3 3 0 01-3 3h-22a3 3 0 01-3-3z" fill="none" stroke="#fff" stroke-width="2"/>
 <circle cx="195" cy="761" r="5" fill="none" stroke="#fff" stroke-width="2"/>
 <rect x="258" y="760" width="14" height="12" rx="3" fill="none" stroke="#5f7898" stroke-width="1.8"/><path d="M272 765l6-3v10l-6-3" fill="none" stroke="#5f7898" stroke-width="1.8" stroke-linejoin="round"/>
 <text x="268" y="794" text-anchor="middle" font-size="11" fill="#5f7898">Videos</text>
 <circle cx="332" cy="768" r="8" fill="none" stroke="#5f7898" stroke-width="1.8"/><circle cx="332" cy="768" r="3" fill="none" stroke="#5f7898" stroke-width="1.8"/>
 <text x="332" y="794" text-anchor="middle" font-size="11" fill="#5f7898">Settings</text>
</g>
</svg>
