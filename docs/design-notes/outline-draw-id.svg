<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" font-family="Segoe UI, Arial, sans-serif">
  <!-- Drawing a new building, the OpenStreetMap iD way:
       thin line with a dark edge so it shows on any roof, a band of colour just inside the edge (roof stays visible),
       a dashed "rubber band" line follows your finger, and tapping the first corner closes the shape. -->
  <rect width="1200" height="675" fill="#5f6b55"/>
  <g stroke="#3d4038" stroke-width="30" fill="none"><path d="M0 560 L1200 360"/><path d="M180 0 L40 675"/></g>
  <g fill="#7d7468"><rect x="120" y="80" width="190" height="120"/><rect x="900" y="470" width="200" height="120"/></g>
  <!-- the roof being traced -->
  <polygon points="430,190 810,150 840,360 455,405" fill="#8a8a86"/>
  <g fill="#6f6f6b"><rect x="520" y="260" width="250" height="60"/></g>

  <!-- top hint -->
  <rect x="380" y="18" width="440" height="44" rx="22" fill="#fff"/>
  <text x="600" y="46" font-size="15" fill="#333" text-anchor="middle">Tap each corner · tap the first corner to finish</text>

  <!-- shape so far: corners A B C, finger is near A -->
  <!-- inside band: colour only near the edge, so the roof underneath stays clear -->
  <clipPath id="inside"><polygon points="430,190 810,150 840,360 455,405"/></clipPath>
  <polygon points="430,190 810,150 840,360 455,405" fill="none" stroke="#ffd166" stroke-opacity="0.35" stroke-width="36" clip-path="url(#inside)"/>
  <!-- dark casing under a thin light line -->
  <polyline points="430,190 810,150 840,360" fill="none" stroke="#222" stroke-opacity="0.6" stroke-width="7" stroke-linejoin="round"/>
  <polyline points="430,190 810,150 840,360" fill="none" stroke="#fff3c4" stroke-width="3" stroke-linejoin="round"/>
  <!-- rubber band to the finger, and the closing edge shown dashed -->
  <line x1="840" y1="360" x2="455" y2="405" stroke="#fff3c4" stroke-width="3" stroke-dasharray="10 8"/>
  <line x1="455" y1="405" x2="430" y2="190" stroke="#fff3c4" stroke-width="2" stroke-dasharray="4 8" opacity="0.8"/>

  <!-- small corner dots: white with dark rim -->
  <g fill="#fff" stroke="#222" stroke-width="2"><circle cx="810" cy="150" r="6"/><circle cx="840" cy="360" r="6"/></g>
  <!-- first corner glows when the finger is close: tap to close -->
  <circle cx="430" cy="190" r="18" fill="#e8460a" fill-opacity="0.25" stroke="#e8460a" stroke-width="2"/>
  <circle cx="430" cy="190" r="7" fill="#e8460a" stroke="#fff" stroke-width="2"/>
  <!-- finger / cursor point with snap ring -->
  <circle cx="455" cy="405" r="7" fill="#fff" stroke="#e8460a" stroke-width="3"/>

  <!-- callouts -->
  <g font-size="14" fill="#fff">
    <text x="300" y="175">Tap here to finish</text>
    <text x="470" y="440">Dashed line follows your finger</text>
    <text x="860" y="250">Thin line + dark edge</text>
    <text x="860" y="270">shows on light and dark roofs</text>
    <text x="580" y="215">Colour only inside the edge</text>
  </g>

  <!-- bottom pill -->
  <rect x="380" y="590" width="440" height="56" rx="28" fill="#fff"/>
  <text x="470" y="624" font-size="16" fill="#333" text-anchor="middle">Undo corner</text>
  <rect x="580" y="596" width="234" height="44" rx="22" fill="#e8460a"/>
  <text x="697" y="624" font-size="16" font-weight="700" fill="#fff" text-anchor="middle">Done</text>
</svg>
