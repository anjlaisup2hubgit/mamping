<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1200 675" font-family="Segoe UI, Arial, sans-serif">
  <!-- Making "Fix shape" faster.
       1. Tidy many at once: Select a row of outlines, one tap makes each a rectangle and turns it to its nearest road.
       2. Phone: the tiny floating tools become a bar at the bottom with words, a zoom bubble, and Next / Previous.
       3. Keyboard shortcuts for every tool, plus a few extra ideas. -->
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#fff"/></marker>
    <g id="row"><rect x="20" y="217" width="360" height="22" fill="#3d4038"/><g fill="#9a5a4a"><rect x="50" y="125" width="60" height="80"/><rect x="130" y="125" width="60" height="80"/><rect x="210" y="125" width="60" height="80"/><rect x="290" y="125" width="60" height="80"/></g></g>
    <clipPath id="lens"><circle cx="600" cy="150" r="36"/></clipPath>
  </defs>
  <rect width="1200" height="675" fill="#5f6b55"/>
  <g stroke="#fff" stroke-opacity="0.4" stroke-width="2"><line x1="400" y1="70" x2="400" y2="650"/><line x1="800" y1="70" x2="800" y2="650"/></g>

  <!-- ===== 1: tidy many at once ===== -->
  <text x="200" y="50" font-size="20" font-weight="700" fill="#fff" text-anchor="middle">1 · Tidy a whole row in one tap</text>
  <text x="40" y="92" font-size="14" fill="#fff">Now: crooked, fixed one by one</text>
  <g transform="rotate(-8 200 195)">
    <use xlink:href="#row" href="#row"/>
    <g fill="#ffd166" fill-opacity="0.12" stroke="#ffd166" stroke-width="1.5"><polygon points="46,133 108,121 114,201 52,209"/><polygon points="128,123 192,131 186,209 126,203"/><polygon points="214,119 268,129 274,207 208,201"/><polygon points="286,131 352,123 348,203 292,211"/></g>
  </g>
  <!-- the bar that shows while Select is on -->
  <rect x="40" y="278" width="320" height="40" rx="20" fill="#fff"/>
  <text x="60" y="303" font-size="15" fill="#333"><tspan font-weight="700">4</tspan> picked</text>
  <rect x="150" y="283" width="204" height="30" rx="15" fill="#e8460a"/>
  <text x="252" y="303" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">Square + line up</text>
  <path d="M200 324 L200 346" stroke="#fff" stroke-width="2" marker-end="url(#a)"/>
  <text x="40" y="366" font-size="14" fill="#fff">After one tap</text>
  <g transform="translate(0 270) rotate(-8 200 195)">
    <use xlink:href="#row" href="#row"/>
    <g fill="#ffd166" fill-opacity="0.08" stroke="#ffd166" stroke-width="1.5"><rect x="50" y="125" width="60" height="80"/><rect x="130" y="125" width="60" height="80"/><rect x="210" y="125" width="60" height="80"/><rect x="290" y="125" width="60" height="80"/></g>
    <!-- little corner marks: this corner is square -->
    <g fill="none" stroke="#fff" stroke-width="1.5"><path d="M58 125 v8 h-8 M102 205 v-8 h8"/><path d="M138 125 v8 h-8 M182 205 v-8 h8"/><path d="M218 125 v8 h-8 M262 205 v-8 h8"/><path d="M298 125 v8 h-8 M342 205 v-8 h8"/></g>
  </g>
  <g font-size="13" fill="#fff"><text x="40" y="570">Select, drag over a row, tap once.</text><text x="40" y="590">Each outline turns to its own nearest road.</text><text x="40" y="610">L-shapes keep their corners, made 90°.</text><text x="40" y="630">One Undo brings the whole row back.</text></g>

  <!-- ===== 2: phone ===== -->
  <text x="600" y="50" font-size="20" font-weight="700" fill="#fff" text-anchor="middle">2 · Phone: big buttons by your thumb</text>
  <rect x="490" y="72" width="220" height="430" rx="26" fill="#111"/>
  <rect x="498" y="80" width="204" height="414" rx="20" fill="#566150"/>
  <rect x="498" y="300" width="204" height="22" fill="#3d4038"/>
  <!-- which outline you are on, with previous / next -->
  <rect x="512" y="92" width="176" height="30" rx="15" fill="#fff"/>
  <g fill="none" stroke="#333" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M530 101 l-6 6 l6 6"/><path d="M670 101 l6 6 l-6 6"/></g>
  <text x="600" y="112" font-size="14" fill="#333" text-anchor="middle"><tspan font-weight="700">7</tspan> of 48</text>
  <!-- the building being fixed -->
  <rect x="545" y="190" width="110" height="80" fill="#9a5a4a"/>
  <polygon points="545,190 655,190 661,276 545,270" fill="#ffd166" fill-opacity="0.08" stroke="#ffd166" stroke-width="1.5"/>
  <g fill="#fff" stroke="#e8460a" stroke-width="2"><circle cx="545" cy="190" r="6"/><circle cx="655" cy="190" r="6"/><circle cx="661" cy="276" r="6"/><circle cx="545" cy="270" r="6"/></g>
  <circle cx="665" cy="282" r="15" fill="#fff" fill-opacity="0.3" stroke="#fff" stroke-width="2"/>
  <!-- zoom bubble: the corner under the finger, 3x bigger -->
  <g clip-path="url(#lens)"><rect x="560" y="110" width="80" height="80" fill="#566150"/><rect x="560" y="110" width="40" height="40" fill="#9a5a4a"/><path d="M560 158 L608 164 L604 110" fill="none" stroke="#ffd166" stroke-width="3"/><circle cx="608" cy="164" r="7" fill="#fff" stroke="#e8460a" stroke-width="3"/></g>
  <circle cx="600" cy="150" r="36" fill="none" stroke="#fff" stroke-width="3"/>
  <path d="M627 174 L652 262" stroke="#fff" stroke-opacity="0.6" stroke-width="1.5" stroke-dasharray="4 4"/>
  <!-- tool bar -->
  <rect x="506" y="374" width="190" height="108" rx="16" fill="#fff"/>
  <g fill="#f1f1ee"><rect x="512" y="380" width="40" height="44" rx="10"/><rect x="558" y="380" width="40" height="44" rx="10"/><rect x="604" y="380" width="40" height="44" rx="10"/><rect x="650" y="380" width="40" height="44" rx="10"/><rect x="512" y="432" width="40" height="44" rx="10"/><rect x="558" y="432" width="40" height="44" rx="10"/></g>
  <g fill="none" stroke="#333" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="524" y="389" width="16" height="12" rx="1.5"/>
    <path d="M574 387 l-3 16 M582 387 l3 16 M578 388 v3 M578 394 v3 M578 400 v3"/>
    <path d="M618 392 a7 7 0 1 1 -1 7 M618 386 v6 h6"/>
    <path d="M676 392 a7 7 0 1 0 1 7 M676 386 v6 h-6"/>
    <path d="M526 440 l-5 5 l5 5 M521 445 h12 a5 5 0 0 1 0 10 h-4"/>
    <path d="M584 440 l5 5 l-5 5 M589 445 h-12 a5 5 0 0 0 0 10 h4"/>
  </g>
  <g font-size="9" fill="#333" text-anchor="middle"><text x="532" y="418">Square</text><text x="578" y="418">Line up</text><text x="624" y="418">Turn</text><text x="670" y="418">Turn</text><text x="532" y="471">Undo</text><text x="578" y="471">Redo</text></g>
  <rect x="604" y="432" width="86" height="44" rx="12" fill="#e8460a"/>
  <text x="638" y="459" font-size="15" font-weight="700" fill="#fff" text-anchor="middle">Next</text>
  <path d="M664 448 l6 6 l-6 6" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
  <g font-size="13" fill="#fff"><text x="430" y="535">Tools at the bottom with words, in thumb reach.</text><text x="430" y="555">Zoom bubble shows the corner under your finger.</text><text x="430" y="575">Turn: 1° a tap, hold to keep turning.</text><text x="430" y="595">Next zooms to the next outline (7 of 48).</text><text x="430" y="615">Computer: same bar, smaller, at the top right.</text></g>

  <!-- ===== 3: keyboard ===== -->
  <text x="1000" y="50" font-size="20" font-weight="700" fill="#fff" text-anchor="middle">3 · Keyboard shortcuts</text>
  <rect x="825" y="78" width="350" height="312" rx="14" fill="#fff"/>
  <g fill="#f1f1ee" stroke="#bbb">
    <rect x="840" y="89" width="24" height="20" rx="5"/>
    <rect x="840" y="116" width="24" height="20" rx="5"/>
    <rect x="840" y="143" width="24" height="20" rx="5"/><rect x="870" y="143" width="62" height="20" rx="5"/>
    <rect x="840" y="170" width="70" height="20" rx="5"/>
    <rect x="840" y="197" width="36" height="20" rx="5"/><rect x="882" y="197" width="76" height="20" rx="5"/>
    <rect x="840" y="224" width="48" height="20" rx="5"/>
    <rect x="840" y="251" width="36" height="20" rx="5"/>
    <rect x="840" y="278" width="24" height="20" rx="5"/>
    <rect x="840" y="305" width="54" height="20" rx="5"/><rect x="900" y="305" width="54" height="20" rx="5"/>
    <rect x="840" y="332" width="36" height="20" rx="5"/>
    <rect x="840" y="359" width="24" height="20" rx="5"/>
  </g>
  <g font-size="12" font-weight="700" fill="#333" text-anchor="middle">
    <text x="852" y="104">Q</text><text x="852" y="131">A</text><text x="852" y="158">R</text><text x="901" y="158">Shift+R</text>
    <text x="875" y="185">← ↑ ↓ →</text><text x="858" y="212">Tab</text><text x="920" y="212">Shift+Tab</text>
    <text x="864" y="239">Enter</text><text x="858" y="266">Del</text><text x="852" y="293">C</text>
    <text x="867" y="320">Ctrl+Z</text><text x="927" y="320">Ctrl+Y</text><text x="858" y="347">Esc</text><text x="852" y="374">?</text>
  </g>
  <g font-size="13" fill="#333">
    <text x="970" y="104">Square the corners</text><text x="970" y="131">Line up with the road</text><text x="970" y="158">Turn 1° right / left</text>
    <text x="970" y="185">Move a tiny step</text><text x="970" y="212">Next / previous outline</text><text x="970" y="239">Keep, go to next</text>
    <text x="970" y="266">Remove</text><text x="970" y="293">Copy to matching roofs</text><text x="970" y="320">Undo / redo</text>
    <text x="970" y="347">Stop fixing</text><text x="970" y="374">Show this list</text>
  </g>
  <text x="825" y="424" font-size="15" font-weight="700" fill="#fff">More ideas</text>
  <g font-size="13" fill="#fff">
    <text x="825" y="448">• Corner marks: ∟ when square, red dot when not.</text>
    <text x="825" y="469">• Snaps to next-door walls, with a blue guide line.</text>
    <text x="825" y="490">• Match size: same width as the building before.</text>
    <text x="825" y="511">• Square keeps L-shapes, it only fixes the angles.</text>
    <text x="825" y="532">• Auto-tidy switch: square + line up every new</text>
    <text x="837" y="551">AI outline before you even look at it.</text>
    <text x="825" y="572">• Size label always on, so odd sizes stand out.</text>
  </g>
</svg>
