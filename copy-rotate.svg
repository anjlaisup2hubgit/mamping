<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" font-family="Segoe UI, Arial, sans-serif">
  <!-- Copy and rotate an outline.
       Left: tap Copy in the floating tools, then tap each matching roof: a same-size copy lands centred on each tap, same angle.
       Right: drag the round handle above the outline to spin it around its middle; it clicks into line with the road or next house. -->
  <defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#fff"/></marker></defs>
  <rect width="1200" height="675" fill="#5f6b55"/>
  <line x1="600" y1="80" x2="600" y2="580" stroke="#fff" stroke-opacity="0.4" stroke-width="2"/>

  <!-- top mode picker stays as it is -->
  <rect x="400" y="18" width="400" height="44" rx="22" fill="#fff"/>
  <text x="470" y="46" font-size="15" fill="#333" text-anchor="middle">Tap = keep</text>
  <text x="590" y="46" font-size="15" fill="#333" text-anchor="middle">Tap = remove</text>
  <rect x="660" y="22" width="136" height="36" rx="18" fill="#e8460a"/><text x="728" y="46" font-size="15" font-weight="700" fill="#fff" text-anchor="middle">Tap = fix</text>

  <!-- ===== LEFT: copy ===== -->
  <text x="300" y="110" font-size="20" font-weight="700" fill="#fff" text-anchor="middle">Copy · tap each matching roof</text>
  <path d="M30 470 L570 470" stroke="#3d4038" stroke-width="30"/>
  <!-- row of identical roofs -->
  <g fill="#9a5a4a"><rect x="60" y="280" width="100" height="140"/><rect x="190" y="280" width="100" height="140"/><rect x="320" y="280" width="100" height="140"/><rect x="450" y="280" width="100" height="140"/></g>
  <!-- original outline -->
  <rect x="60" y="280" width="100" height="140" fill="#e8460a" fill-opacity="0.25" stroke="#e8460a" stroke-width="3"/>
  <g fill="#e8460a" stroke="#fff" stroke-width="2"><circle cx="60" cy="280" r="7"/><circle cx="160" cy="280" r="7"/><circle cx="160" cy="420" r="7"/><circle cx="60" cy="420" r="7"/></g>
  <!-- copies already placed -->
  <rect x="190" y="280" width="100" height="140" fill="#e8460a" fill-opacity="0.25" stroke="#e8460a" stroke-width="3"/>
  <rect x="320" y="280" width="100" height="140" fill="#e8460a" fill-opacity="0.25" stroke="#e8460a" stroke-width="3"/>
  <!-- ghost copy following the finger over the last roof -->
  <rect x="450" y="280" width="100" height="140" fill="#fff" fill-opacity="0.15" stroke="#fff" stroke-width="2" stroke-dasharray="8 6"/>
  <circle cx="500" cy="350" r="10" fill="#fff" stroke="#e8460a" stroke-width="3"/>
  <g font-size="14" fill="#fff">
    <text x="60" y="250">Original</text>
    <text x="190" y="250">Copies: same size, same angle</text>
    <text x="440" y="440">Tap to drop</text>
    <text x="60" y="520">Copy stays on until you tap Done, so a whole row takes one tap per house.</text>
    <text x="60" y="540">A copy edge close to a roof edge clicks onto it.</text>
  </g>
  <!-- copy mode pill -->
  <rect x="150" y="150" width="300" height="44" rx="22" fill="#fff"/>
  <text x="260" y="178" font-size="15" fill="#333" text-anchor="middle">Copying · 2 placed</text>
  <rect x="356" y="155" width="88" height="34" rx="17" fill="#e8460a"/><text x="400" y="178" font-size="15" font-weight="700" fill="#fff" text-anchor="middle">Done</text>

  <!-- ===== RIGHT: rotate ===== -->
  <text x="900" y="110" font-size="20" font-weight="700" fill="#fff" text-anchor="middle">Rotate · drag the round handle</text>
  <path d="M640 520 L1180 330" stroke="#3d4038" stroke-width="30"/>
  <!-- tilted roof -->
  <polygon points="760,300 960,230 1000,345 800,415" fill="#8a8a86"/>
  <!-- old position, faint dashed -->
  <rect x="775" y="255" width="210" height="120" fill="none" stroke="#fff" stroke-opacity="0.6" stroke-width="2" stroke-dasharray="6 6"/>
  <!-- outline now turned to match -->
  <polygon points="760,300 960,230 1000,345 800,415" fill="#e8460a" fill-opacity="0.25" stroke="#e8460a" stroke-width="3"/>
  <g fill="#e8460a" stroke="#fff" stroke-width="2"><circle cx="760" cy="300" r="7"/><circle cx="960" cy="230" r="7"/><circle cx="1000" cy="345" r="7"/><circle cx="800" cy="415" r="7"/></g>
  <!-- stalk and rotate handle above the top wall's middle -->
  <line x1="860" y1="265" x2="838" y2="203" stroke="#fff" stroke-width="2"/>
  <circle cx="832" cy="186" r="17" fill="#fff" stroke="#222" stroke-width="1.5"/>
  <path d="M824 180 a9 9 0 1 1 1 13" fill="none" stroke="#222" stroke-width="2.2" stroke-linecap="round"/>
  <path d="M820 174 l4 6 l6 -3" fill="none" stroke="#222" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- swing arrow -->
  <path d="M900 190 A110 110 0 0 0 850 180" fill="none" stroke="#fff" stroke-width="2" marker-end="url(#a)"/>
  <!-- angle label + "lined up" hint -->
  <rect x="930" y="150" width="200" height="34" rx="17" fill="#fff"/>
  <text x="1030" y="173" font-size="15" font-weight="700" fill="#333" text-anchor="middle">−19° · lined up with road</text>
  <g font-size="14" fill="#fff">
    <text x="660" y="470">Spins around its middle, size stays the same.</text>
    <text x="660" y="490">Clicks into line when it matches the road or the next house.</text>
  </g>

  <!-- floating tools: two new buttons, Copy and Rotate is the handle -->
  <rect x="440" y="590" width="320" height="60" rx="30" fill="#fff"/>
  <g fill="none" stroke="#333" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <rect x="466" y="604" width="22" height="16" rx="2"/>
    <path d="M530 608 h14 a7 7 0 0 1 0 14 h-8"/><path d="M534 602 l-6 6 l6 6"/>
    <g stroke="#e8460a"><rect x="584" y="606" width="16" height="16" rx="2"/><path d="M590 606 v-6 h16 v16 h-6"/></g>
    <path d="M656 603 l18 18 M674 603 l-18 18" stroke="#c0392b"/>
  </g>
  <g stroke="#e5e5e5" stroke-width="1.5"><path d="M508 600 v40"/><path d="M566 600 v40"/><path d="M630 600 v40"/></g>
  <g font-size="11" fill="#555" text-anchor="middle"><text x="477" y="640">Rectangle</text><text x="537" y="640">Undo</text><text x="598" y="640" fill="#e8460a" font-weight="700">Copy (new)</text><text x="665" y="640">Not one</text></g>
</svg>
