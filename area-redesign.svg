<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" font-family="Segoe UI, Arial, sans-serif">
  <!-- fake satellite map -->
  <rect width="1200" height="675" fill="#5f6b55"/>
  <g fill="#7d7468" opacity="0.9">
    <rect x="40" y="60" width="70" height="40"/><rect x="140" y="90" width="60" height="45"/><rect x="60" y="230" width="80" height="50"/>
    <rect x="420" y="190" width="90" height="40"/><rect x="560" y="170" width="70" height="55"/><rect x="690" y="200" width="80" height="40"/>
    <rect x="430" y="330" width="70" height="50"/><rect x="590" y="320" width="100" height="45"/><rect x="720" y="360" width="60" height="40"/>
    <rect x="950" y="80" width="140" height="90"/><rect x="980" y="300" width="80" height="50"/><rect x="120" y="420" width="70" height="45"/>
  </g>
  <g stroke="#3d4038" stroke-width="22" fill="none"><path d="M0 120 L1200 300"/><path d="M300 0 L180 675"/><path d="M1000 0 L860 675"/></g>

  <!-- dim everything outside the chosen squares -->
  <path d="M0 0 H1200 V675 H0Z M375 140 V440 H825 V140Z" fill="#000" opacity="0.35" fill-rule="evenodd"/>

  <!-- the box IS the satellite pictures: one square = one picture the AI reads -->
  <g fill="#1F6FEB" fill-opacity="0.12" stroke="#fff" stroke-width="2">
    <rect x="375" y="140" width="150" height="150"/><rect x="525" y="140" width="150" height="150"/><rect x="675" y="140" width="150" height="150"/>
    <rect x="375" y="290" width="150" height="150"/><rect x="525" y="290" width="150" height="150"/><rect x="675" y="290" width="150" height="150"/>
  </g>
  <rect x="375" y="140" width="450" height="300" fill="none" stroke="#1F6FEB" stroke-width="3"/>
  <g font-size="15" font-weight="700" fill="#fff" text-anchor="middle">
    <circle cx="400" cy="163" r="13" fill="#1F6FEB"/><text x="400" y="168">1</text>
    <circle cx="550" cy="163" r="13" fill="#1F6FEB"/><text x="550" y="168">2</text>
    <circle cx="700" cy="163" r="13" fill="#1F6FEB"/><text x="700" y="168">3</text>
    <circle cx="400" cy="313" r="13" fill="#1F6FEB"/><text x="400" y="318">4</text>
    <circle cx="550" cy="313" r="13" fill="#1F6FEB"/><text x="550" y="318">5</text>
    <circle cx="700" cy="313" r="13" fill="#1F6FEB"/><text x="700" y="318">6</text>
  </g>

  <!-- ghost square: where the next picture would snap in while dragging -->
  <rect x="825" y="140" width="150" height="150" fill="none" stroke="#fff" stroke-width="2" stroke-dasharray="8 6" opacity="0.7"/>
  <text x="900" y="220" font-size="13" fill="#fff" text-anchor="middle" opacity="0.9">drag to add</text>

  <!-- handles: two corners + move -->
  <g stroke="#fff" stroke-width="3">
    <circle cx="375" cy="140" r="12" fill="#e8460a"/><circle cx="825" cy="440" r="12" fill="#e8460a"/>
    <circle cx="600" cy="290" r="16" fill="#e8460a"/>
  </g>
  <path d="M600 280 V300 M590 290 H610" stroke="#fff" stroke-width="2.5" stroke-linecap="round"/>

  <!-- small hint at top instead of a big panel -->
  <rect x="380" y="24" width="440" height="40" rx="20" fill="#fff" opacity="0.95"/>
  <text x="600" y="50" font-size="15" fill="#333" text-anchor="middle">Drag a corner. Each square is one picture the AI reads.</text>

  <!-- compact bottom bar (replaces the tall sheet) -->
  <rect x="270" y="590" width="660" height="64" rx="32" fill="#fff"/>
  <text x="302" y="619" font-size="16" font-weight="700" fill="#222">6 pictures</text>
  <text x="302" y="640" font-size="13" fill="#777">most per scan: 9</text>
  <rect x="470" y="602" width="170" height="40" rx="20" fill="#e8460a"/>
  <text x="555" y="628" font-size="16" font-weight="600" fill="#fff" text-anchor="middle">Scan these</text>
  <rect x="652" y="602" width="200" height="40" rx="20" fill="#fff" stroke="#ccc"/>
  <text x="752" y="628" font-size="15" fill="#333" text-anchor="middle">Whole screen</text>
  <circle cx="890" cy="622" r="20" fill="#f1f1f1"/>
  <path d="M882 614 L898 630 M898 614 L882 630" stroke="#555" stroke-width="2.5" stroke-linecap="round"/>

  <!-- notes -->
  <g font-size="13" fill="#fff">
    <text x="30" y="520">• Box snaps to whole pictures, so what you see is exactly what is scanned.</text>
    <text x="30" y="540">• Over the limit? Extra squares turn grey and say "skipped" before you scan.</text>
    <text x="30" y="560">• Panel is one short bar at the bottom, so the map stays visible.</text>
  </g>
</svg>
